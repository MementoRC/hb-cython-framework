<!DOCTYPE html>
<html><head><title>Cython Annotate</title></head><body>
<div class="cython"><pre>
<span class="line" style="background-color: #FFFFaa;">  1: <span>import cython</span></span>
<span class="line" style="">  2: </span>
<span class="line" style="background-color: #FFFF33;">  3: <span>@cython.ccall</span></span>
<span class="line" style="background-color: #FFFF00;">  4: <span>def add(a: cython.int, b: cython.int) -> cython.int:</span></span>
<span class="line" style="">  5: <span>    return a + b</span></span>
<span class="line" style="">  6: </span>
<span class="line" style="background-color: #FFFF00;">  7: <span>def multiply(a: cython.double, b: cython.double) -> cython.double:</span></span>
<span class="line" style="">  8: <span>    return a * b</span></span>
</pre></div>
</body></html>
