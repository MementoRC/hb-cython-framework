[project]
name = "hb-cython-framework"
dynamic = ["version"]
description = "Augmented Pure Python testing and build tooling for hummingbot sub-packages"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "cython>=3",
]

[project.optional-dependencies]
testing = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "cython_framework/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["cython_framework"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
cython = ">=3"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = "*"
ruff = "*"
mypy = "*"

[tool.pixi.feature.ci.dependencies]
ruff = ">=0.1.6"
mypy = ">=1.5.1"
pytest = ">=7.0.0"
pytest-cov = ">=4.1.0"
pre-commit = ">=2.15.0"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
lint = "ruff check cython_framework tests"
format = "ruff format cython_framework tests"
format-check = "ruff format --check cython_framework tests"
typecheck = "mypy cython_framework"
quality = { depends-on = ["lint", "format-check"] }
check = { depends-on = ["quality", "test"] }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
timeout = 300

[tool.coverage.run]
branch = true
source_pkgs = ["cython_framework"]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
