[project]
name = "hb-cython-framework"
dynamic = ["version"]
description = "Augmented Pure Python testing and build tooling for hummingbot sub-packages"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "cython>=3.2.4",
]

[project.optional-dependencies]
testing = [
    "pytest>=9.0.3",
]

[project.entry-points.hatch]
augmented-cython = "cython_framework.buildhook.hook"

[build-system]
requires = ["hatchling>=1.29.0", "cython>=3.2.4", "numpy>=2.2.6", "setuptools>=64"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "cython_framework/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["cython_framework"]

# Env-gated, pragma-driven Cython build hook.
# Default OFF: pure-Python wheel, no Cython/compiler invoked, so bleeding-edge and
# ordinary CI build with no C toolchain. Set HB_COMPILE_AUGMENTED=1 to compile every
# module bearing the `# cython: augmented_pure_python=True` pragma under `paths`.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
dependencies = ["cython>=3.2.4", "numpy>=2.2.6", "setuptools>=64"]
paths = ["cython_framework"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
cython = ">=3"
numpy = ">=1.20.0"
hatch-cython = ">=0.5.0"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = "*"
pytest-xdist = "*"
pytest-timeout = "*"
ruff = "*"
mypy = "*"
python-build = "*"
hatchling = ">=1.18.0"
hypothesis = "*"

[tool.pixi.feature.ci.dependencies]
ruff = ">=0.1.6"
mypy = ">=1.5.1"
pytest = ">=7.0.0"
pytest-cov = ">=4.1.0"
pre-commit = ">=2.15.0"
bandit = ">=1.8.0"
types-setuptools = "*"

[tool.pixi.feature.quality-extended.dependencies]
bandit = ">=1.8.0"
pip-audit = "*"
filelock = "*"

[tool.pixi.feature.quality-extended.tasks]
security-scan = "bandit -c pyproject.toml -r cython_framework/"
safety-check = "pip-audit"

[tool.pixi.feature.quality-ci.dependencies]
python-build = "*"
hatchling = "*"

[tool.pixi.feature.quality-ci.tasks]
build = "python -m build"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-extended = { features = ["quality-extended"], solve-group = "default" }
quality-ci = { features = ["quality-ci"], solve-group = "default" }
py310 = { features = ["py310", "dev"], solve-group = "py310" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tool.pixi.tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
lint = "ruff check cython_framework tests"
lint-fix = "ruff check --fix cython_framework tests"
format = "ruff format cython_framework tests"
format-check = "ruff format --check cython_framework tests"
typecheck = "mypy cython_framework"
quality = { depends-on = ["lint", "format-check"] }
check = { depends-on = ["quality", "test"] }
build = "python -m build --wheel --no-isolation"
test-compile = { depends-on = ["build", "test"] }
security = "bandit -c pyproject.toml -r cython_framework/"
type-check = "mypy cython_framework"
install-refactor = "python -m pip install -e ../../../../refactor-applications --no-deps"
cython-convert = "python cython_framework/refactors/cython_rules.py --apply"
cython-convert-dry = "python cython_framework/refactors/cython_rules.py"
pytest-migrate = "python cython_framework/refactors/pytest_rules.py --apply"
pytest-migrate-dry = "python cython_framework/refactors/pytest_rules.py"
report = "python -m cython_framework.analysis.reporter"
annotate = "python -m cython_framework.analysis.annotate"
classify = "python -m cython_framework.analysis.classifier"
correlate = "python -m cython_framework.analysis.correlator"
generate-tests = "python -m cython_framework.validation.generator"
baseline-capture = "python -m cython_framework.validation.baseline"
validate-performance = "python -m cython_framework.validation.regression"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_functions = "test_*"
timeout = 300
log_cli = true
log_cli_level = "DEBUG"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "asyncio: marks tests as asyncio tests",
]
timeout_method = "thread"
addopts = "--strict-markers --strict-config"
minversion = "7.0"

[tool.coverage.run]
branch = true
source_pkgs = ["cython_framework"]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
